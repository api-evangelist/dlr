- name: EOWEB GeoPortal API
  description: >-
    Multi-mission web portal API for interactive access to the DLR Earth observation data holdings including
    browse-and-download features, time-series data access, OGC WMS/WFS/WMTS/TMS browsing services, and
    WCS-based data download for authorized users. Supports guest access for browsing and registered user
    access for ordering datasets.
  image: https://www.dlr.de/favicon.ico
  humanURL: https://eoweb.dlr.de/egp/
  baseURL: https://eoweb.dlr.de/egp/
