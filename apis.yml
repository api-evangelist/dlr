name: DLR
description: The German Aerospace Center (DLR) Earth Observation Center (EOC) provides
  public APIs for accessing Earth observation satellite data, remote sensing products,
  and scientific datasets from German aerospace research missions. Services include
  OGC-compliant WMS, WCS, CSW, STAC, and WMTS endpoints covering atmospheric trace
  gases, digital elevation models, land cover, hyperspectral imagery, water resources,
  and more from missions such as TanDEM-X, TerraSAR-X, EnMAP, DESIS, and Sentinel
  series.
